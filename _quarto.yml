
project:
  type: website
  output-dir: _site
  render:
    - "index.qmd"
    - "docs/install.md"
    - "docs/credentials.md"
    - "docs/providers.md"
    - "docs/data_layers.md"
    - "docs/adding_a_mission.md"
    - "docs/architecture.qmd"
    - "docs/configuration.md"
    - "docs/fusion.md"
    - "docs/performance.qmd"
    - "docs/HPC_QUICKSTART.md"
    - "docs/project_structure.md"
    - "CHANGELOG.md"
    - "CONTRIBUTING.md"
    - "CONTRIBUTORS.md"
    - "CODE_OF_CONDUCT.md"
    # Auto-generated API reference (see quartodoc: block below).
    # The pre-render hook (`quartodoc build`) emits docs/api/*.qmd on
    # every render; the glob picks them up automatically.
    - "docs/api/*.qmd"
  pre-render:
    # Regenerate docs/api/ from docstrings before rendering, so the
    # site is always in sync with the current package code. Uses
    # `python -m quartodoc` (not the bare `quartodoc` CLI) so it
    # picks up whatever Python is on PATH -- necessary because
    # Quarto's pre-render step doesn't inherit shell aliases, and
    # `quartodoc` may live in a conda env that isn't on the default
    # PATH. In CI (see .github/workflows/quarto-pages.yml) `python`
    # is the workflow's setup-python interpreter with `[dev]`
    # installed; locally you need to run from a shell that has
    # activated the env with quartodoc installed.
    - python -m quartodoc build
  post-render: scripts/quarto-cleanup.sh

