format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toggle: true
    toc: true
    toc-depth: 3
    code-copy: true
    css: site_styles.css

# Auto-generated Python API reference. Runs before every render via
# quartodoc's Quarto pre-render hook (see quartodoc.build below).
# The `sidebar:` line writes a fragment we splice into the sidebar
# under `Project reference` -> `API reference`.
quartodoc:
  package: geoai_datacubes
  dir: docs/api
  title: "API reference"
  sidebar: docs/api/_sidebar.yml
  render_interlinks: true
  sections:
    - title: "Data acquisition"
      desc: "Download raw imagery + ancillary layers from public + commercial providers."
      contents:
        - fetch.fetch_sentinel_data
        - fetch.resolve_aoi
        - fetch.MISSION_PROFILES
        - fetch.get_profile
        - fetch.get_provider_config
        - fetch.validate_query
        - fetch.fetch_earthsearch
        - fetch.fetch_planetary_computer
        - fetch.fetch_direct_http
        - fetch.fetch_planet
        - fetch.fetch_sentinelhub
    - title: "Pre-processing: fuse, tile, export"
      desc: "Turn raw fetched imagery into AI-ready data cubes."
      contents:
        - preprocessing.fuse_response_tiffs
        - preprocessing.tile_geotiff
        - preprocessing.AVAILABLE_AUGMENTATIONS
        - preprocessing.LazyTileDataset
        - preprocessing.geotiff_to_zarr
        - preprocessing.export_to_zarr
        - preprocessing.export_to_lmdb
    - title: "Band math + metadata"
      desc: "Per-band normalisation, cloud masking, mission-aware NaN handling."
      contents:
        - preprocessing.normalize_band
        - preprocessing.compute_ndvi
        - preprocessing.compute_ndwi
        - preprocessing.compute_dem_gradient_magnitude
        - preprocessing.cloud_mask
        - preprocessing.infer_band_kind
