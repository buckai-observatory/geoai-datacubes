name: notebooks

# Executes the shipped notebooks 00 and 01 top to bottom, from the locked
# pixi `notebooks` environment, on a macOS Apple-silicon runner. This is
# the route docs/install.md tells users to take
# (`pixi install -e notebooks --locked`, `pixi run -e notebooks jupyter lab`),
# so a notebook or environment regression on that route fails here instead
# of reaching a user. The test suite (tests.yml) never runs the notebooks.
#
# The notebooks download imagery from Earth Search and the Planetary
# Computer, so a run can also fail because a provider is down or
# rate-limiting; the per-cell log says which cell.
#
# Notebook 03 runs in a second job, `notebook-03-macos`, only on the weekly
# schedule and on manual dispatch: it needs the `full` environment
# (geoai-py and omniwatermask, 3.6 GB), runs OmniWaterMask and trains a
# small U-Net on the CPU, and takes well over an hour, which is too slow
# for a pull-request check. Start it by hand from the Actions tab
# ("Run workflow") or with `gh workflow run notebooks.yml --ref <branch>`.

on:
  push:
    branches: [main]
    paths:
      - "geoai_datacubes/**"
      - "notebooks/**"
      - "pyproject.toml"
      - "pixi.lock"
      - "smoke-tests/run_notebook.py"
      - ".github/workflows/notebooks.yml"
  pull_request:
    branches: [main]
    paths:
      - "geoai_datacubes/**"
      - "notebooks/**"
      - "pyproject.toml"
      - "pixi.lock"
      - "smoke-tests/run_notebook.py"
      - ".github/workflows/notebooks.yml"
  schedule:
    # Weekly, so drift in the data providers or in the lockfile's
    # assumptions shows up even when nothing was pushed.
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  # The event name is part of the group so that a push to main does not
  # cancel a scheduled or manually started run on main.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  notebooks-macos:
    name: notebooks 00 + 01 (macOS arm64, pixi notebooks env)
    # macos-latest is Apple silicon (arm64) since macOS 14. The pixi lock
    # has an osx-arm64 solve, so this installs exactly what a Mac user gets.
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools_scm derives the version from the git history.
          fetch-depth: 0

      - name: Set up pixi and install the locked notebooks environment
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.77.1
          environments: notebooks
          # --locked: fail if pyproject.toml and pixi.lock disagree.
          locked: true
          cache: true

      - name: Environment sanity (the same checks a user would do)
        run: |
          pixi run --locked -e notebooks python - <<'PY'
          import sys, importlib
          print("python  :", sys.executable)
          assert ".pixi/envs/notebooks/" in sys.executable, sys.executable
          for m in ["geoai_datacubes", "torch", "xgboost", "sklearn",
                    "skimage", "zarr", "contextily", "nbclient", "ipykernel"]:
              mod = importlib.import_module(m)
              print(f"{m:16s} {getattr(mod, '__version__', '')}")
          import rasterio
          with rasterio.Env() as env:
              jp2 = sorted(d for d in env.drivers() if "JP2" in d)
          print("JP2 drivers:", jp2)
          assert jp2, "no JPEG-2000 GDAL driver in the notebooks environment"
          PY
          echo "jupyter -> $(pixi run --locked -e notebooks which jupyter)"
          pixi run --locked -e notebooks jupyter kernelspec list

      - name: Notebook 00 (data-pipeline tour)
        run: |
          pixi run --locked -e notebooks python smoke-tests/run_notebook.py \
            notebooks/00_geoai_datacubes_tour.ipynb \
            --expect-prefix "$PWD/.pixi/envs/notebooks"

      - name: Notebook 01 (classification, cached models)
        # The shipped Random Forest cache is reused only under the
        # scikit-learn version that wrote it; otherwise the notebook
        # retrains it (a few minutes), which is the path a new user hits.
        run: |
          pixi run --locked -e notebooks python smoke-tests/run_notebook.py \
            notebooks/01_classification.ipynb \
            --expect-prefix "$PWD/.pixi/envs/notebooks"

      - name: Upload executed notebooks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebooks-macos
          path: notebooks/_outputs/executed/
          if-no-files-found: ignore
          retention-days: 14

  notebook-03-macos:
    name: notebook 03 (macOS arm64, pixi full env; weekly and on dispatch)
    # Not on push or pull_request: see the note at the top of this file.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pixi and install the locked full environment
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.77.1
          environments: full
          locked: true
          cache: true

      - name: Environment sanity (the same checks a user would do)
        run: |
          pixi run --locked -e full python - <<'PY'
          import sys, importlib
          print("python  :", sys.executable)
          assert ".pixi/envs/full/" in sys.executable, sys.executable
          for m in ["geoai_datacubes", "geoai", "omniwatermask", "torch",
                    "skimage", "rasterio", "nbclient", "ipykernel"]:
              mod = importlib.import_module(m)
              print(f"{m:16s} {getattr(mod, '__version__', '')}")
          PY
          echo "jupyter -> $(pixi run --locked -e full which jupyter)"
          pixi run --locked -e full jupyter kernelspec list

      - name: Notebook 03 (opengeos/geoai integration)
        # The fetch cell pulls NAIP, Sentinel-2, Sentinel-1 and the DEM for
        # three cities (about 10 min); OmniWaterMask and the U-Net training
        # run on the CPU and take longer, hence the one-hour per-cell limit.
        run: |
          pixi run --locked -e full python smoke-tests/run_notebook.py \
            notebooks/03_with_opengeos_geoai.ipynb \
            --timeout 3600 \
            --expect-prefix "$PWD/.pixi/envs/full"

      - name: Upload executed notebook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebook-03-macos
          path: notebooks/_outputs/executed/
          if-no-files-found: ignore
          retention-days: 14
