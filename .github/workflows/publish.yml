name: publish

# Triggered ONLY on a pushed git tag matching `v*` (e.g. v0.1.0).
# This intentionally decouples release from regular pushes -- nothing
# uploads to PyPI unless a maintainer explicitly tags + pushes.
#
# The `workflow_dispatch` trigger also lets you run the workflow
# manually from the GitHub Actions UI for emergencies / dry runs.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with full history for setuptools_scm)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # required: setuptools_scm derives version from tags

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build

      - name: Build wheel + sdist
        run: python -m build

      - name: Show the built artefacts
        run: |
          ls -lh dist/
          python -m zipfile -l dist/*.whl | tail -20
          tar -tzf dist/*.tar.gz | head -25

      - name: Upload to workflow artefacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest

    # The `pypi` environment is configured in the GitHub repo settings
    # (Settings -> Environments). If you set it to "Required reviewers"
    # it adds a manual approval step here before the upload fires.
    environment:
      name: pypi
      url: https://pypi.org/project/geoai-datacubes/

    # The OIDC permission lets the runner identify itself to PyPI
    # without an API token. This works in combination with the
    # "Trusted Publisher" entry on PyPI (set up once via
    # https://pypi.org/manage/account/publishing/).
    permissions:
      id-token: write

    steps:
      - name: Download the built artefacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # The action picks up `dist/*.whl` and `dist/*.tar.gz` by default.
        # No `password:` -- OIDC handles the auth.
