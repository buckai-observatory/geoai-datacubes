name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel an in-progress run on a branch when a newer commit lands on the
# same branch -- spares CI minutes on quick-succession pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # setuptools_scm needs the full history (or at least the latest
          # tag) to derive the version. shallow=0 gives it everything.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package + test deps
        # `[dev]` = pytest + ruff + pre-commit.
        # `[earthdata]` = earthaccess + h5py + xarray + h5netcdf, needed
        #   by the tracks-reader tests (test_atl06_reader, test_tracks).
        # `[ml]` = torch + torchvision + scikit-image + sklearn + xgboost
        #   + ultralytics + transformers, needed by the tiler + ml_dl
        #   tests. As of the torch-out-of-core refactor (Aug 2026) this
        #   extra is what installs PyTorch; without it, only the
        #   fetch + fuse + core-preprocessing surface is available. The
        #   full-matrix job below verifies both surfaces at once.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,earthdata,ml]"

      - name: Run the test suite
        run: pytest -v --color=yes

      - name: Lint with ruff (advisory only)
        # Ruff config lives in pyproject.toml. We run it but don't fail
        # the build on lint -- that keeps CI focused on correctness while
        # the codebase ages into the rule set.
        run: |
          ruff check geoai_datacubes tests || true
          ruff format --check geoai_datacubes tests || true

  # Separate lightweight job that verifies the minimal install (no [ml]
  # extra, no PyTorch, no scikit-image) still imports the fetch and
  # core-preprocessing surfaces cleanly. Guards against a regression
  # where a new fetch feature accidentally re-acquires a torch dep at
  # module top level and silently forces every fetch-only user back to
  # the ~2 GB install. Runs the dedicated test_minimal_install.py suite
  # which uses a MetaPathFinder to block torch imports at runtime, but
  # this job installs the pyproject.toml deps for real -- so if [ml] is
  # ever moved back into `dependencies` the job's own env grows and the
  # size check fails.
  minimal-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install core + [dev] ONLY (no [ml], no torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Assert PyTorch is not installed
        run: |
          if python -c "import torch" 2>/dev/null; then
            echo "REGRESSION: torch was installed by the core+dev deps"
            echo "This means the [ml] extra has leaked back into"
            echo "core dependencies. See PR #<num> for the rationale."
            exit 1
          fi
          echo "OK: torch is not installed in the minimal-install env"

      - name: Fetch + core-preprocessing surface imports cleanly
        run: |
          python -c "from geoai_datacubes.fetch import fetch_sentinel_data"
          python -c "from geoai_datacubes.preprocessing import fuse_response_tiffs, tile_geotiff, compute_ndvi"
          echo "OK: fetch + core-preprocessing importable without [ml]"

      - name: Run the minimal-install test suite
        run: pytest tests/test_minimal_install.py -v --color=yes
