name: Quarto docs site

on:
  push:
    branches: [main]
    paths:
      - "index.qmd"
      - "docs/**"
      - "_quarto.yml"
      - "site_styles.css"
      - "site_images/**"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "CONTRIBUTORS.md"
      - "CODE_OF_CONDUCT.md"
      - "scripts/quarto-cleanup.sh"
      - ".github/workflows/quarto-pages.yml"
  workflow_dispatch:

# Only one deploy at a time
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
